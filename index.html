<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARAMS - ระบบบริหารงานทะเบียนและวัดผล</title>
    <!-- TH Sarabun Font -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #34495e;
            --accent-color: #3498db;
            --bg-color: #f4f6f7;
            --text-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 18px;
        }

        /* --- Login System --- */
        #login-container {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
        }

        .login-box {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: var(--primary-color);
            font-size: 32px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 18px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent-color);
        }

        .input-group .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7f8c8d;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .remember-me input {
            margin-right: 10px;
            cursor: pointer;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: var(--secondary-color);
        }

        /* --- Dashboard Layout (SPA) --- */
        .app-container {
            display: none;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: var(--primary-color);
            color: white;
            position: fixed;
            height: 100%;
            padding-top: 20px;
            overflow-y: auto;
        }

        .sidebar-header {
            text-align: center;
            padding: 0 20px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-menu li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
            font-size: 18px;
        }

        .sidebar-menu li a:hover {
            background-color: var(--secondary-color);
            border-left: 4px solid var(--accent-color);
        }

        .sidebar-menu li a i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }

        .main-content {
            margin-left: 250px;
            padding: 20px;
            width: calc(100% - 250px);
            min-height: 100vh;
        }

        .topbar {
            background: #fff;
            padding: 15px 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .btn-logout {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-logout:hover {
            background-color: #c0392b;
        }

        /* Pages */
        .page-content { display: none; }
        .page-content.active { display: block; }
        
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            min-height: 80vh;
        }

        .page-title { 
            margin-bottom: 20px; 
            color: var(--primary-color); 
            border-bottom: 2px solid var(--accent-color); 
            padding-bottom: 10px; 
            display:inline-block;
        }

        /* --- ตารางและฟอร์ม --- */
        .data-table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 20px; 
            font-size: 18px; 
        }
        .data-table th, .data-table td { 
            border: 1px solid #ddd; 
            padding: 12px; 
            text-align: left; 
        }
        .data-table th { 
            background-color: var(--primary-color); 
            color: white; 
        }
        .data-table tr:nth-child(even) { background-color: #f9f9f9; }
        .data-table tr:hover { background-color: #f1f1f1; }
        
        .btn-action { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-right: 5px; color: white;}
        .btn-edit { background-color: #f39c12; }
        .btn-delete { background-color: #e74c3c; }
        .btn-add { background-color: #2ecc71; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; margin-bottom: 15px;}
        .btn-import { background-color: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-size: 18px; margin-bottom: 15px;}
        
        .form-input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 18px; }
        
        #csvFileInput { display: none; }
    </style>
</head>
<body>

    <!-- ================= Login Page ================= -->
    <div id="login-container">
        <div class="login-box">
            <h2>ARAMS</h2>
            <p style="margin-bottom: 20px; color: #7f8c8d;">เข้าสู่ระบบจัดการทะเบียนและวัดผล</p>
            <div class="input-group">
                <input type="text" id="username" placeholder="ชื่อผู้ใช้">
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="รหัสผ่าน">
                <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
            </div>
            <div class="remember-me">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">จดจำการเข้าสู่ระบบ</label>
            </div>
            <button class="btn-login" onclick="login()" id="btnLogin">เข้าสู่ระบบ <i class="fas fa-sign-in-alt"></i></button>
        </div>
    </div>

    <!-- ================= Main App Container ================= -->
    <div class="app-container" id="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>ARAMS</h3>
                <p id="user-name-display" style="font-size: 14px; color:#ccc; margin-top:5px;"></p>
                <span id="user-role-badge" style="font-size:12px; background:var(--accent-color); padding:2px 8px; border-radius:10px; margin-top:5px; display:inline-block;"></span>
            </div>
            <!-- เมนูจะถูกสร้างอัตโนมัติตาม Role -->
            <ul class="sidebar-menu" id="sidebar-menu"></ul>
        </div>
        
        <div class="main-content">
            <div class="topbar">
                <h3 id="topbar-title">ยินดีต้อนรับ</h3>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
            </div>
            <!-- พื้นที่แสดงเนื้อหาของแต่ละเมนู -->
            <div id="content-area"></div>
        </div>
    </div>

    <!-- ================= Script ================= -->
    <script>
        // *** วาง URL ของ Web App จาก Google Apps Script ที่นี่ ***
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwgG8bb9gooS7ITQ-K1LLBYr4CoNXHyU3E_bGwQQ4V26mWm44StrAa0yKScM4jmmbCdBQ/exec';

        // โครงสร้างเมนูของแต่ละ Role
        const roleMenus = {
            admin: [
                { id: 'admin-course', icon: 'fa-book', title: 'รายวิชา' },
                { id: 'admin-student', icon: 'fa-user-graduate', title: 'ทะเบียนนักเรียน' },
                { id: 'admin-class', icon: 'fa-chalkboard-teacher', title: 'ระดับชั้น' },
                { id: 'admin-teacher', icon: 'fa-chalkboard', title: 'ทะเบียนคุณครู' },
                { id: 'admin-academic', icon: 'fa-star', title: 'ทะเบียนฝ่ายวิชาการ' },
                { id: 'admin-assign', icon: 'fa-tasks', title: 'มอบหมายภาระงาน' },
                { id: 'admin-setting-t', icon: 'fa-cogs', title: 'ตั้งค่าระบบคุณครู' },
                { id: 'admin-setting-s', icon: 'fa-cog', title: 'ตั้งค่าระบบนักเรียน' },
                { id: 'admin-setting-sys', icon: 'fa-sliders-h', title: 'ตั้งค่าระบบ' }
            ],
            teacher: [
                { id: 'teacher-grade', icon: 'fa-edit', title: 'บันทึกคะแนน' },
                { id: 'teacher-rework', icon: 'fa-tools', title: 'กำหนดงานแก้ตัว' },
                { id: 'teacher-request', icon: 'fa-envelope-open-text', title: 'คำร้องขอแก้ตัว' }
            ],
            student: [
                { id: 'student-dashboard', icon: 'fa-chart-line', title: 'ผลการเรียนเฉลี่ย' },
                { id: 'student-score', icon: 'fa-list-alt', title: 'คะแนนเก็บ' },
                { id: 'student-history', icon: 'fa-history', title: 'ประวัติคำร้องขอแก้ตัว' }
            ],
            academic: [
                { id: 'academic-check', icon: 'fa-search-plus', title: 'ตรวจสอบคะแนนและอนุมัติ' }
            ]
        };

        let tempCSVData = []; // ตัวแปรเก็บข้อมูลชั่วคราวสำหรับอัปโหลด CSV

        // เริ่มต้นตรวจสอบว่าเคย Login ไว้หรือไม่ (Remember Me)
        window.onload = function() {
            const savedSession = localStorage.getItem('arams_session');
            if (savedSession) {
                const userData = JSON.parse(savedSession);
                initApp(userData);
            }
        };

        // สลับเปิดปิดตา Password
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.querySelector('.toggle-password');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ระบบ Login เข้าสู่ระบบ
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const remember = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('btnLogin');

            if (!user || !pass) {
                Swal.fire({ icon: 'warning', title: 'แจ้งเตือน', text: 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', confirmButtonColor: '#3498db' });
                return;
            }

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังเข้าสู่ระบบ...';
            btn.disabled = true;

            try {
                // ส่งค่าไปตรวจสอบที่ GAS
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        data: { username: user, password: pass }
                    })
                });

                const result = await response.json();

                if (result.status === 'success') {
                    if (remember) {
                        localStorage.setItem('arams_session', JSON.stringify(result.userData));
                    }
                    initApp(result.userData);
                } else {
                    Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: result.message, confirmButtonColor: '#e74c3c' });
                }
            } catch (error) {
                Swal.fire({ icon: 'error', title: 'ข้อผิดพลาดระบบ', text: 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้', confirmButtonColor: '#e74c3c' });
            } finally {
                btn.innerHTML = 'เข้าสู่ระบบ <i class="fas fa-sign-in-alt"></i>';
                btn.disabled = false;
            }
        }

        // โหลดข้อมูลหลัง Login ผ่าน
        function initApp(userData) {
            document.getElementById('login-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'flex';
            
            document.getElementById('user-name-display').innerText = userData.name;
            document.getElementById('user-role-badge').innerText = userData.role.toUpperCase();

            // สร้างเมนูตาม Role
            const menuContainer = document.getElementById('sidebar-menu');
            const contentArea = document.getElementById('content-area');
            menuContainer.innerHTML = '';
            contentArea.innerHTML = '';

            const menus = roleMenus[userData.role];
            menus.forEach((menu, index) => {
                // สร้างปุ่มเมนู
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" onclick="loadPage('${menu.id}', '${menu.title}')"><i class="fas ${menu.icon}"></i> ${menu.title}</a>`;
                menuContainer.appendChild(li);

                // สร้างพื้นที่หน้าต่าง (Div) รอไว้
                const pageDiv = document.createElement('div');
                pageDiv.id = menu.id;
                pageDiv.className = 'page-content card';
                pageDiv.innerHTML = `<h2 class="page-title">${menu.title}</h2><p>กำลังเตรียมระบบย่อย...</p>`;
                contentArea.appendChild(pageDiv);
            });

            // เปิดหน้าแรกอัตโนมัติ
            if (menus.length > 0) {
                loadPage(menus[0].id, menus[0].title);
            }
            
            // ล้างค่าฟอร์มล็อกอิน
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // ระบบสลับหน้า (SPA - ไม่รีเฟรช) และโหลดข้อมูลเมนูนั้นๆ
        function loadPage(pageId, title) {
            document.getElementById('topbar-title').innerText = title;
            const pages = document.querySelectorAll('.page-content');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');

            // เมื่อกดเปิดเมนู ให้เรนเดอร์เนื้อหาตามเมนูที่กด
            if (pageId === 'admin-course') renderSubjectPage();
            if (pageId === 'admin-student') renderStudentPage();
        }

        // ระบบออกจากระบบ (ทำทันที ไม่รีเฟรช)
        function logout() {
            Swal.fire({
                title: 'ออกจากระบบ?',
                text: "คุณต้องการออกจากระบบใช่หรือไม่?",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                cancelButtonColor: '#bdc3c7',
                confirmButtonText: 'ใช่, ออกจากระบบ',
                cancelButtonText: 'ยกเลิก'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('arams_session');
                    document.getElementById('app-container').style.display = 'none';
                    document.getElementById('login-container').style.display = 'flex';
                }
            });
        }

        // ==============================================================
        // 1. ระบบจัดการรายวิชา (Subjects)
        // ==============================================================
        async function renderSubjectPage() {
            const container = document.getElementById('admin-course');
            container.innerHTML = `
                <h2 class="page-title"><i class="fas fa-book"></i> จัดการรายวิชา</h2>
                <br>
                <button class="btn-add" onclick="openSubjectModal()"><i class="fas fa-plus"></i> เพิ่มรายวิชา</button>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>รหัสวิชา</th>
                            <th>ชื่อวิชา</th>
                            <th>หน่วยกิต</th>
                            <th>ประเภท</th>
                            <th>ระดับชั้น</th>
                            <th>ห้อง</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="subject-table-body">
                        <tr><td colspan="7" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            `;
            fetchSubjects();
        }

        async function fetchSubjects() {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'get_subjects' })
                });
                const result = await response.json();
                const tbody = document.getElementById('subject-table-body');
                tbody.innerHTML = '';

                if (result.status === 'success' && result.data.length > 0) {
                    result.data.forEach(sub => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${sub.Code}</td>
                                <td>${sub.Name}</td>
                                <td>${sub.Credit}</td>
                                <td>${sub.Type}</td>
                                <td>${sub.Level}</td>
                                <td>${sub.Room}</td>
                                <td>
                                    <button class="btn-action btn-edit" onclick='openSubjectModal(${JSON.stringify(sub)})'><i class="fas fa-edit"></i></button>
                                    <button class="btn-action btn-delete" onclick="deleteSubject('${sub.SubjectID}')"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">ยังไม่มีข้อมูลรายวิชา</td></tr>';
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลรายวิชาได้', 'error');
            }
        }

        function openSubjectModal(data = null) {
            const isEdit = data !== null;
            Swal.fire({
                title: isEdit ? 'แก้ไขรายวิชา' : 'เพิ่มรายวิชา',
                html: `
                    <input type="hidden" id="sub_id" value="${isEdit ? data.SubjectID : 'SUB_' + new Date().getTime()}">
                    <input type="text" id="sub_code" class="form-input" placeholder="รหัสวิชา (เช่น ท22102)" value="${isEdit ? data.Code : ''}">
                    <input type="text" id="sub_name" class="form-input" placeholder="ชื่อวิชา (เช่น ภาษาไทย)" value="${isEdit ? data.Name : ''}">
                    <input type="number" step="0.5" id="sub_credit" class="form-input" placeholder="หน่วยกิต (เช่น 1.5)" value="${isEdit ? data.Credit : ''}">
                    <select id="sub_type" class="form-input">
                        <option value="พื้นฐาน" ${isEdit && data.Type == 'พื้นฐาน' ? 'selected' : ''}>พื้นฐาน</option>
                        <option value="เพิ่มเติม" ${isEdit && data.Type == 'เพิ่มเติม' ? 'selected' : ''}>เพิ่มเติม</option>
                        <option value="กิจกรรมพัฒนาผู้เรียน" ${isEdit && data.Type == 'กิจกรรมพัฒนาผู้เรียน' ? 'selected' : ''}>กิจกรรมพัฒนาผู้เรียน</option>
                    </select>
                    <select id="sub_level" class="form-input">
                        <option value="ม.1" ${isEdit && data.Level == 'ม.1' ? 'selected' : ''}>มัธยมศึกษาปีที่ 1</option>
                        <option value="ม.2" ${isEdit && data.Level == 'ม.2' ? 'selected' : ''}>มัธยมศึกษาปีที่ 2</option>
                        <option value="ม.3" ${isEdit && data.Level == 'ม.3' ? 'selected' : ''}>มัธยมศึกษาปีที่ 3</option>
                        <option value="ม.4" ${isEdit && data.Level == 'ม.4' ? 'selected' : ''}>มัธยมศึกษาปีที่ 4</option>
                        <option value="ม.5" ${isEdit && data.Level == 'ม.5' ? 'selected' : ''}>มัธยมศึกษาปีที่ 5</option>
                        <option value="ม.6" ${isEdit && data.Level == 'ม.6' ? 'selected' : ''}>มัธยมศึกษาปีที่ 6</option>
                    </select>
                    <input type="text" id="sub_room" class="form-input" placeholder="ห้อง (เช่น 1 หรือ 1,2,3)" value="${isEdit ? data.Room : ''}">
                `,
                showCancelButton: true,
                confirmButtonText: 'บันทึก',
                cancelButtonText: 'ยกเลิก',
                preConfirm: () => {
                    return {
                        SubjectID: document.getElementById('sub_id').value,
                        Code: document.getElementById('sub_code').value,
                        Name: document.getElementById('sub_name').value,
                        Credit: document.getElementById('sub_credit').value,
                        Type: document.getElementById('sub_type').value,
                        Level: document.getElementById('sub_level').value,
                        Room: document.getElementById('sub_room').value
                    }
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.showLoading();
                    const payload = {
                        action: isEdit ? 'edit_subject' : 'add_subject',
                        data: result.value
                    };
                    const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const resData = await resp.json();
                    if(resData.status === 'success') {
                        Swal.fire('สำเร็จ', resData.message, 'success');
                        fetchSubjects();
                    }
                }
            });
        }

        function deleteSubject(id) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                text: "คุณจะไม่สามารถกู้คืนข้อมูลนี้ได้!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                confirmButtonText: 'ลบข้อมูล'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.showLoading();
                    const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_subject', data: { SubjectID: id } }) });
                    const resData = await resp.json();
                    if(resData.status === 'success') {
                        Swal.fire('ลบแล้ว!', 'ข้อมูลถูกลบเรียบร้อย', 'success');
                        fetchSubjects();
                    }
                }
            });
        }

        // ==============================================================
        // 2. ระบบทะเบียนนักเรียน (Students) & อัปโหลด CSV
        // ==============================================================
        async function renderStudentPage() {
            const container = document.getElementById('admin-student');
            container.innerHTML = `
                <h2 class="page-title"><i class="fas fa-user-graduate"></i> ทะเบียนนักเรียน</h2>
                <br>
                <button class="btn-import" onclick="document.getElementById('csvFileInput').click()"><i class="fas fa-file-csv"></i> นำเข้าจาก CSV</button>
                <button class="btn-action" style="background-color:#7f8c8d; margin-bottom: 15px;" onclick="downloadCSVTemplate()"><i class="fas fa-download"></i> โหลดเทมเพลต CSV</button>
                <input type="file" id="csvFileInput" accept=".csv" onchange="handleCSVUpload(event)">
                
                <!-- ส่วนพรีวิวข้อมูล CSV ก่อนบันทึก -->
                <div id="csv-preview-container" style="display:none; background:#fef9e7; padding:15px; border-radius:5px; margin-bottom:20px; border: 1px solid #f1c40f;">
                    <h3 style="color:#f39c12; margin-bottom:10px;"><i class="fas fa-exclamation-triangle"></i> ตรวจสอบข้อมูลก่อนบันทึก</h3>
                    <p>กรุณาเลือกชั้นและตรวจสอบลำดับนักเรียน คุณสามารถกดปุ่มเลื่อนขึ้น/ลงได้</p>
                    <select id="csv_class_select" class="form-input" style="width: 200px; display:inline-block;">
                        <option value="ม.1/1">ม.1/1</option>
                        <option value="ม.2/1">ม.2/1</option>
                        <option value="ม.3/1">ม.3/1</option>
                        <option value="ม.4/1">ม.4/1</option>
                        <option value="ม.5/1">ม.5/1</option>
                        <option value="ม.6/1">ม.6/1</option>
                    </select>
                    <button class="btn-add" onclick="saveBulkCSV()"><i class="fas fa-save"></i> บันทึกข้อมูลทั้งหมด</button>
                    <button class="btn-action btn-delete" onclick="cancelCSV()"><i class="fas fa-times"></i> ยกเลิก</button>
                    
                    <table class="data-table">
                        <thead><tr><th>ลำดับ</th><th>รหัสประจำตัว</th><th>คำนำหน้า</th><th>ชื่อ-สกุล</th><th>เลขบัตรประชาชน</th><th>เลื่อนตำแหน่ง</th></tr></thead>
                        <tbody id="csv-preview-body"></tbody>
                    </table>
                </div>

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>รหัสประจำตัว</th>
                            <th>คำนำหน้า</th>
                            <th>ชื่อ-สกุล</th>
                            <th>เลขบัตรประชาชน</th>
                            <th>ระดับชั้น/ห้อง</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="student-table-body">
                        <tr><td colspan="6" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
                    </tbody>
                </table>
            `;
            fetchStudents();
        }

        async function fetchStudents() {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'get_students' })
                });
                const result = await response.json();
                const tbody = document.getElementById('student-table-body');
                tbody.innerHTML = '';

                if (result.status === 'success' && result.data.length > 0) {
                    result.data.forEach(stu => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${stu.StudentID}</td>
                                <td>${stu.Prefix}</td>
                                <td>${stu.FullName}</td>
                                <td>${stu.CardID}</td>
                                <td>${stu.ClassID}</td>
                                <td>
                                    <button class="btn-action btn-delete" onclick="deleteStudent('${stu.StudentID}')"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">ยังไม่มีข้อมูลนักเรียน</td></tr>';
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลนักเรียนได้', 'error');
            }
        }

        // โหลดเทมเพลตไฟล์ CSV
        function downloadCSVTemplate() {
            const csvContent = "\uFEFFรหัสประจำตัว,คำนำหน้า,ชื่อ,สกุล,เลขบัตรประจำตัวประชาชน\n12345,เด็กชาย,สมชาย,เรียนดี,1101101101101\n12346,เด็กหญิง,สมหญิง,รักเรียน,1101101101102";
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "template_students.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // อ่านไฟล์ CSV
        function handleCSVUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const text = e.target.result;
                const lines = text.split('\n').filter(line => line.trim() !== '');
                tempCSVData = [];
                
                // เริ่มที่ index 1 เพื่อข้ามหัวตาราง
                for(let i = 1; i < lines.length; i++) {
                    const cols = lines[i].split(',');
                    if(cols.length >= 5) {
                        tempCSVData.push({
                            studentId: cols[0].trim(),
                            prefix: cols[1].trim(),
                            fullName: cols[2].trim() + ' ' + cols[3].trim(),
                            cardId: cols[4].trim()
                        });
                    }
                }
                document.getElementById('csvFileInput').value = ""; // รีเซ็ต input
                renderCSVPreview();
            };
            reader.readAsText(file);
        }

        // พรีวิว CSV ในตาราง พร้อมปุ่มสลับตำแหน่ง
        function renderCSVPreview() {
            document.getElementById('csv-preview-container').style.display = 'block';
            const tbody = document.getElementById('csv-preview-body');
            tbody.innerHTML = '';
            
            tempCSVData.forEach((row, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${row.studentId}</td>
                        <td>${row.prefix}</td>
                        <td>${row.fullName}</td>
                        <td>${row.cardId}</td>
                        <td>
                            <button class="btn-action" style="background:#34495e;" onclick="moveCSVRow(${index}, -1)"><i class="fas fa-arrow-up"></i></button>
                            <button class="btn-action" style="background:#34495e;" onclick="moveCSVRow(${index}, 1)"><i class="fas fa-arrow-down"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        // ฟังก์ชันเลื่อนลำดับนักเรียน
        function moveCSVRow(index, direction) {
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= tempCSVData.length) return; // เกินขอบเขต
            
            // สลับตำแหน่ง Array
            const temp = tempCSVData[index];
            tempCSVData[index] = tempCSVData[newIndex];
            tempCSVData[newIndex] = temp;
            
            renderCSVPreview(); // วาดตารางใหม่
        }

        function cancelCSV() {
            tempCSVData = [];
            document.getElementById('csv-preview-container').style.display = 'none';
        }

        // บันทึกข้อมูล CSV ทั้งหมดลงฐานข้อมูล
        async function saveBulkCSV() {
            if(tempCSVData.length === 0) return;
            const selectedClass = document.getElementById('csv_class_select').value;
            
            Swal.fire({
                title: 'กำลังบันทึกข้อมูล...',
                allowOutsideClick: false,
                didOpen: () => { Swal.showLoading(); }
            });

            // แปลง Array Object เป็น Array Matrix เพื่อส่งไป GAS
            const dataMatrix = tempCSVData.map(row => [
                row.studentId, 
                row.prefix, 
                row.fullName, 
                row.cardId, 
                selectedClass
            ]);

            const payload = {
                action: 'add_students_bulk',
                data: { studentsArray: dataMatrix }
            };

            try {
                const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                const resData = await resp.json();
                if(resData.status === 'success') {
                    Swal.fire('สำเร็จ', \`นำเข้าข้อมูลนักเรียน \${dataMatrix.length} คน เรียบร้อยแล้ว\`, 'success');
                    cancelCSV();
                    fetchStudents();
                }
            } catch (error) {
                Swal.fire('ข้อผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้', 'error');
            }
        }

        function deleteStudent(id) {
            Swal.fire({
                title: 'ยืนยันการลบ?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e74c3c',
                confirmButtonText: 'ลบข้อมูล'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.showLoading();
                    const resp = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_student', data: { StudentID: id } }) });
                    const resData = await resp.json();
                    if(resData.status === 'success') {
                        Swal.fire('ลบแล้ว!', 'ข้อมูลถูกลบเรียบร้อย', 'success');
                        fetchStudents();
                    }
                }
            });
        }
    </script>
</body>
